# Roz ek video: trend -> script -> video -> (optional) post. Keys GitHub repo Secrets me (Settings -> Secrets and variables -> Actions).
name: Daily video
on:
  schedule:
    - cron: "0 13 * * *"     # 18:30 IST
  workflow_dispatch:
    inputs:
      topic: { description: "Topic (khali = AI khud chunega)", required: false }
      post: { description: "Post karna hai? (true/false)", required: false, default: "false" }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu
      - run: pip install -r requirements.txt
      - name: Make video
        working-directory: backend
        env:
          SC_SET_POST_YOUTUBE: "true"       # posting tabhi hoga jab --post ho (neeche) aur token Secrets me ho
          SC_SET_POST_INSTAGRAM: "true"
          SC_SET_USE_AI_VIDEO: "true"
          SC_AUTO_APPROVE: "1"        # Actions me koi Accept dabane wala nahi hota — isliye ye sirf tab ON rakho jab aap bharosa karo
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
          LUMA_API_KEY: ${{ secrets.LUMA_API_KEY }}
          KLING_ACCESS_KEY: ${{ secrets.KLING_ACCESS_KEY }}
          KLING_SECRET_KEY: ${{ secrets.KLING_SECRET_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          FLAG=--no-post
          if [ "${{ github.event.inputs.post }}" = "true" ]; then FLAG=--post; fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ -n "$YT_TOKEN_JSON$IG_ACCESS_TOKEN" ]; then FLAG=--post; fi
          python -m socialcontrol run ${{ github.event.inputs.topic && format('--topic "{0}"', github.event.inputs.topic) || '' }} $FLAG
      - uses: actions/upload-artifact@v4
        with: { name: video, path: data/runs/*/final.mp4, retention-days: 7 }
